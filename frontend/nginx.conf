server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Same-origin proxy to Strapi: the browser never needs CMS host or credentials.
  location /api/ {
    proxy_pass http://cms:1337/api/;
    proxy_set_header Host $host;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
